<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Random - Kibzai</title>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Montserrat:200,300,400,600");

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: #000000;
        }

        .title {
            z-index: 10;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translateX(-50%) translateY(-50%);
            font-family: "Montserrat";
            text-align: center;
            width: 100%;
            background: radial-gradient(circle, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 33%);
            padding: 20vh;
            pointer-events: none;
        }

        .title>* {
            pointer-events: auto;
        }

        .title h3 a {
            color: white;
            text-decoration: none;
        }

        .title h1 {
            position: relative;
            color: #EEEEEE;
            font-weight: 600;
            font-size: 60px;
            padding: 0;
            margin: 0;
            text-shadow: 0 0 30px #000155;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .title h2 {
            position: relative;
            color: #EEEEEE;
            font-weight: 300;
            font-size: 50px;
            padding: 0;
            margin: 0;
            text-shadow: 0 0 30px #000155;
        }

        .title h3 {
            font-weight: 200;
            font-size: 1.7rem;
            padding: 0;
            margin: 0;
            color: #EEEEEE;
            letter-spacing: 2px;
            text-shadow: 0 0 30px #000155;
        }

        .btn-liquid {
            display: inline-block;
            position: relative;
            width: 240px;
            height: 60px;
            border-radius: 27px;
            color: #fff;
            font: 700 14px/60px "Montserrat", sans-serif;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 0 15px rgba(67, 203, 255, 0.3);
            pointer-events: auto;
        }

        .btn-liquid:hover {
            transform: scale(1.02);
        }

        .btn-liquid:active {
            transform: scale(0.98);
        }

        .btn-liquid .inner {
            position: relative;
            z-index: 2;
        }

        .btn-liquid canvas {
            position: absolute;
            top: -80px;
            right: -80px;
            bottom: -80px;
            left: -80px;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="title">
        <h3><a href="tools/">Herramientas</a></h3>
        <h2>WWW</h2>
        <h1 id="linkTitle">Random</h1>
        <br>
        <a href="#" id="randomLinkBtn" class="btn-liquid" target="_blank">
            <span class="inner">RANDOM</span>
        </a>
    </div>

    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
    <script>
        (function () {
            // ------------------------------------------------------------
            // PARTÍCULAS DE FONDO
            // ------------------------------------------------------------
            var max_particles = Math.min(1000, Math.floor(window.innerWidth * window.innerHeight / 800));
            var tela = document.createElement('canvas');
            tela.width = $(window).width();
            tela.height = $(window).height();
            $("body").append(tela);
            var canvasCtx = tela.getContext('2d');

            var Particle = function () {
                var random = Math.random();
                this.progress = 0;
                this.x = $(window).width() / 2 + (Math.random() * 200 - Math.random() * 200);
                this.y = $(window).height() / 2 + (Math.random() * 200 - Math.random() * 200);
                this.w = $(window).width();
                this.h = $(window).height();
                this.radius = random > 0.1 ? Math.random() * 0.8 : Math.random() * 1.8;
                if (random > 0.9) this.radius = Math.random() * 2;
                this.color = random > 0.1 ? "#43CBFF" : "#E406D6";
                if (random > 0.9) this.color = "#FFFFFF";
                this.variantx1 = Math.random() * 100;
                this.variantx2 = Math.random() * 100;
                this.varianty1 = Math.random() * 100;
                this.varianty2 = Math.random() * 100;
            };

            Particle.prototype.render = function () {
                canvasCtx.beginPath();
                canvasCtx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
                canvasCtx.fillStyle = this.color;
                canvasCtx.fill();
            };

            Particle.prototype.move = function () {
                this.x += Math.sin(this.progress / this.variantx1) * Math.cos(this.progress / this.variantx2);
                this.y += Math.sin(this.progress / this.varianty1) * Math.cos(this.progress / this.varianty2);
                if (this.x < 0 || this.x > this.w - this.radius || this.y < 0 || this.y > this.h - this.radius) {
                    return false;
                }
                this.render();
                this.progress++;
                return true;
            };

            var particles = [];

            function populate(num) {
                for (var i = 0; i < num; i++) {
                    setTimeout(function () {
                        particles.push(new Particle());
                    }, i * 20);
                }
                return particles.length;
            }

            var init_num = populate(max_particles);

            function clearParticles() {
                canvasCtx.globalAlpha = 0.02;
                canvasCtx.fillStyle = '#000155';
                canvasCtx.fillRect(0, 0, tela.width, tela.height);
                canvasCtx.globalAlpha = 1;
            }

            function updateParticles() {
                particles = particles.filter(function (p) { return p.move(); });
                if (particles.length < init_num) populate(1);
                clearParticles();
                requestAnimationFrame(updateParticles);
            }
            updateParticles();

            $(window).on('resize', function () {
                tela.width = $(window).width();
                tela.height = $(window).height();
                var newW = tela.width;
                var newH = tela.height;
                particles.forEach(function (p) {
                    p.w = newW;
                    p.h = newH;
                    p.x = newW / 2 + (Math.random() * 200 - Math.random() * 200);
                    p.y = newH / 2 + (Math.random() * 200 - Math.random() * 200);
                });
                max_particles = Math.min(1000, Math.floor(newW * newH / 800));
                if (particles.length < max_particles) {
                    populate(max_particles - particles.length);
                }
            });
        })();

        // ------------------------------------------------------------
        // BOTÓN LÍQUIDO (con resize optimizado)
        // ------------------------------------------------------------
        $(function () {
            var button = $('.btn-liquid');
            if (!button.length) return;

            var viscosity = 30;
            var mouseDist = 60;
            var damping = 0.08;
            var pointsCount = 8;
            var strength = 1.8;

            var pointsA = [], pointsB = [];
            var $canvas = null, ctx = null;
            var rafId = null;
            var mouseX = 0, mouseY = 0;
            var relMouseX = 0, relMouseY = 0;
            var mouseSpeedX = 0, mouseSpeedY = 0;
            var mouseDirectionX = 0, mouseDirectionY = 0;
            var lastMouseX = 0, lastMouseY = 0;
            var lastTimestamp = 0;
            var hasMouseMoved = false;

            function updateMouse(e) {
                var now = performance.now();
                var clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                var dx = clientX - lastMouseX;
                var dy = clientY - lastMouseY;
                var dt = Math.max(1, now - lastTimestamp);
                mouseSpeedX = dx / dt * 16;
                mouseSpeedY = dy / dt * 16;
                mouseDirectionX = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
                mouseDirectionY = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
                lastMouseX = clientX;
                lastMouseY = clientY;
                lastTimestamp = now;

                mouseX = clientX;
                mouseY = clientY;
                hasMouseMoved = true;

                if ($canvas && $canvas[0]) {
                    var offset = $canvas.offset();
                    if (offset) {
                        relMouseX = mouseX - offset.left;
                        relMouseY = mouseY - offset.top;
                    }
                }
            }

            $(document).on('mousemove touchmove', function (e) {
                updateMouse(e);
            });

            $(document).on('touchstart', function (e) {
                updateMouse(e);
            });

            function Point(x, y, level) {
                this.ix = 80 + x;
                this.iy = 80 + y;
                this.x = this.ix;
                this.y = this.iy;
                this.vx = 0;
                this.vy = 0;
                this.level = level;
            }

            Point.prototype.move = function () {
                this.vx += (this.ix - this.x) / (viscosity * this.level);
                this.vy += (this.iy - this.y) / (viscosity * this.level);

                var dx = this.ix - relMouseX;
                var dy = this.iy - relMouseY;
                var dist = Math.hypot(dx, dy);
                var influence = 1 - Math.min(1, dist / mouseDist);
                if (influence > 0 && hasMouseMoved) {
                    var pushX = mouseSpeedX * strength * influence;
                    var pushY = mouseSpeedY * strength * influence;
                    if ((mouseDirectionX > 0 && this.x < relMouseX) || (mouseDirectionX < 0 && this.x > relMouseX)) {
                        this.vx += pushX;
                    }
                    if ((mouseDirectionY > 0 && this.y < relMouseY) || (mouseDirectionY < 0 && this.y > relMouseY)) {
                        this.vy += pushY;
                    }
                }

                this.vx *= (1 - damping);
                this.vy *= (1 - damping);
                this.x += this.vx;
                this.y += this.vy;

                var maxOffset = 55;
                this.x = Math.min(Math.max(this.x, this.ix - maxOffset), this.ix + maxOffset);
                this.y = Math.min(Math.max(this.y, this.iy - maxOffset), this.iy + maxOffset);
            };

            function addPoints(x, y) {
                pointsA.push(new Point(x, y, 1));
                pointsB.push(new Point(x, y, 2));
            }

            function catmullRomPoint(p0, p1, p2, p3, t) {
                var t2 = t * t;
                var t3 = t2 * t;
                var x = 0.5 * ((2 * p1.x) +
                    (-p0.x + p2.x) * t +
                    (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                    (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
                var y = 0.5 * ((2 * p1.y) +
                    (-p0.y + p2.y) * t +
                    (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                    (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
                return { x: x, y: y };
            }

            function drawShape(points, fillStyle) {
                if (points.length < 3) return;
                var n = points.length;
                ctx.beginPath();
                for (var i = 0; i < n; i++) {
                    var p0 = points[(i - 1 + n) % n];
                    var p1 = points[i];
                    var p2 = points[(i + 1) % n];
                    var p3 = points[(i + 2) % n];
                    var steps = 12;
                    for (var s = 0; s <= steps; s++) {
                        var t = s / steps;
                        var pt = catmullRomPoint(p0, p1, p2, p3, t);
                        if (s === 0 && i === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    }
                }
                ctx.closePath();
                ctx.fillStyle = fillStyle;
                ctx.fill();
            }

            function renderLoop() {
                if (!ctx) return;
                rafId = requestAnimationFrame(renderLoop);

                ctx.clearRect(0, 0, $canvas.width(), $canvas.height());

                for (var i = 0; i < pointsA.length; i++) {
                    pointsA[i].move();
                    pointsB[i].move();
                }

                var gradX = Math.min(Math.max(relMouseX, 0), $canvas.width());
                var gradY = Math.min(Math.max(relMouseY, 0), $canvas.height());
                var cx = $canvas.width() / 2, cy = $canvas.height() / 2;
                var dist = Math.hypot(gradX - cx, gradY - cy) / Math.hypot(cx, cy);
                var gradient = ctx.createRadialGradient(gradX, gradY, 300 + (300 * dist), gradX, gradY, 0);
                gradient.addColorStop(0, '#102ce5');
                gradient.addColorStop(1, '#E406D6');

                drawShape(pointsA, '#1CE2D8');
                drawShape(pointsB, gradient);
            }

            function initButton() {
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
                if ($canvas) {
                    $canvas.remove();
                    $canvas = null;
                    ctx = null;
                }
                pointsA.length = 0;
                pointsB.length = 0;

                var btnW = button.width();
                var btnH = button.height();

                $canvas = $('<canvas></canvas>');
                button.append($canvas);
                var canvasElem = $canvas[0];
                ctx = canvasElem.getContext('2d');
                canvasElem.width = btnW + 160;
                canvasElem.height = btnH + 160;

                var x = btnH / 2;
                for (var j = 1; j < pointsCount; j++) {
                    addPoints(x + ((btnW - btnH) / pointsCount) * j, 0);
                }
                addPoints(btnW - btnH / 5, 0);
                addPoints(btnW + btnH / 10, btnH / 2);
                addPoints(btnW - btnH / 5, btnH);
                for (var k = pointsCount - 1; k > 0; k--) {
                    addPoints(x + ((btnW - btnH) / pointsCount) * k, btnH);
                }
                addPoints(btnH / 5, btnH);
                addPoints(-btnH / 10, btnH / 2);
                addPoints(btnH / 5, 0);

                if (hasMouseMoved && $canvas && $canvas[0]) {
                    var offset = $canvas.offset();
                    if (offset) {
                        relMouseX = mouseX - offset.left;
                        relMouseY = mouseY - offset.top;
                    }
                }

                renderLoop();
            }

            initButton();

            var resizeTimeout;
            $(window).on('resize', function () {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(function () {
                    initButton();
                }, 150);
            });
        });

        // ------------------------------------------------------------
        // GESTIÓN DE URLs ALEATORIAS (sin repetición consecutiva)
        // ------------------------------------------------------------
        var urls = [
            { url: "https://kibzai.github.io/Programs/MAFIA", title: "Random" }
        ];
        var lastIndex = -1;
        var currentIndex = -1;

        function setRandomLink() {
            if (!urls.length) return;
            var randomIndex;
            if (urls.length === 1) {
                randomIndex = 0;
            } else if (urls.length === 2) {
                randomIndex = (currentIndex === 0) ? 1 : 0;
            } else {
                do {
                    randomIndex = Math.floor(Math.random() * urls.length);
                } while (randomIndex === lastIndex && urls.length > 1);
            }
            lastIndex = currentIndex; // el índice que se acaba de abrir pasa a ser el último
            currentIndex = randomIndex;
            var chosen = urls[randomIndex];
            $('#randomLinkBtn').attr('href', chosen.url);
            $('#linkTitle').text(chosen.title || "Random");
        }

        // Cargar urls.json (estructura { "urls": [...] })
        fetch('urls.json')
            .then(function (response) {
                if (!response.ok) throw new Error('No se pudo cargar urls.json');
                return response.json();
            })
            .then(function (data) {
                if (Array.isArray(data.urls) && data.urls.length) {
                    urls = data.urls;
                }
                setRandomLink();
            })
            .catch(function () {
                console.warn('Usando enlaces de respaldo (urls.json no disponible)');
                setRandomLink();
            });

        // Al hacer clic NO se regenera el enlace, solo se permite la navegación.
        // Después de abrir el enlace, cuando la página recupere visibilidad, se prepara el siguiente destino.
        $('#randomLinkBtn').on('click', function (e) {
            // No prevenimos el comportamiento por defecto, dejamos que abra el href actual.
            // Programamos la regeneración del siguiente enlace para cuando el usuario regrese.
            setTimeout(function () {
                // Si la página permanece visible (pestaña actual), regeneramos tras 500ms.
                if (!document.hidden) {
                    setRandomLink();
                }
            }, 500);
        });

        // Si el usuario abre el enlace en una nueva pestaña, la pestaña actual se mantiene visible,
        // pero también podemos usar el evento visibilitychange para regenerar al volver.
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                // El usuario ha regresado a esta pestaña, preparamos nuevo enlace.
                setRandomLink();
            }
        });

        // Establecer enlace inicial
        setRandomLink();
    </script>
</body>

</html>
